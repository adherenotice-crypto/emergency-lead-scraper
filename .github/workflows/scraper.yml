name: Surplus Lead Ingress & Skip-Trace Automation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry Run Mode (No KV Writes)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours

jobs:
  run-ingress-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Surplus Lead Ingress Engine
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          MIN_SURPLUS_THRESHOLD: 1000
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python ingress_engine.py
