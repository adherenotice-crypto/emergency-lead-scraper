name: Lead Scraper & Ingress Engine Workflow

on:
  schedule:
    - cron: '0 16 * * *'  # Runs daily at 9:00 AM PST
  workflow_dispatch:      # Allows manual trigger via GitHub Actions UI button

jobs:
  run-ingress-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl urllib3

      - name: Execute Lead Scraper & Ingress Engine
        env:
          WORKER_URL: "https://emergencyaudit.com"
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python main.py
        run: |
          python main.py
