name: scrub-and-dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  scrub-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevents any step from hanging past 15 minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install --default-timeout=60 --no-cache-dir -r requirements.txt
          fi

      - name: Execute Scraper & Ingestion Pipeline
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          PAUSE_PIPELINE: "false"
          DRY_RUN: "false"
          STAGING_MODE: "false"
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py
