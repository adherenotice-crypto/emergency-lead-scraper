name: 24/7 Live Lead Scraper Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install axios rss-parser

      - name: Run Live Lead Pipeline
        env:
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
        run: node public_scraper.js
