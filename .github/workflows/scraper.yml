name: Surplus Lead Ingress & Skip-Trace Automation

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in Dry Run Mode (No KV Writes)"
        required: false
        default: "false"
        type: boolean

jobs:
  run-ingress-engine:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3 pandas

      - name: 🚀 Execute Surplus Lead Ingress Engine
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENABLE_AUTO_SKIP_TRACE: "true"
          MIN_COUNTY_SURPLUS: "5000.00"
          MIN_STATE_SURPLUS: "10000.00"
          PAUSE_PIPELINE: "false"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          STAGING_MODE: "false"
        run: |
          python ingress_engine.py
