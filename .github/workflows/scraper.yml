name: Emergency Lead Scraper Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'  # Runs every 3 hours
  workflow_dispatch:       # Allows manual trigger in GitHub Actions UI
  push:
    branches:
      - main

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Main Scraper
        env:
          WORKER_URL: "https://emergencyaudit.com"
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY || 'EmergencyAudit_Master_Key_2026!' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          ENABLE_AUTO_SKIP_TRACE: "true"
        run: |
          python main.py
