name: EmergencyAudit Pay-Per-Call Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:         # Enables manual trigger button in GitHub

jobs:
  scrub-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Scraper Pipeline
        env:
          WORKER_URL: "https://emergencyaudit.com"
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          TRACERFY_URL: "https://tracerfy.com/v1/api/trace/lookup/"
          ENABLE_TRACERFY: ${{ secrets.ENABLE_TRACERFY || 'false' }}
          PAUSE_PIPELINE: ${{ secrets.PAUSE_PIPELINE }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          STAGING_MODE: ${{ secrets.STAGING_MODE }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          NETWORK_1800_NUMBER: ${{ secrets.NETWORK_1800_NUMBER }}
          ENABLE_TWILIO_SMS: "true"
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
        run: |
          python so_cal_lead_pipeline.py
