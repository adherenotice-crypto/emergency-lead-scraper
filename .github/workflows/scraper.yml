name: EmergencyAudit Pay-Per-Call Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual trigger button in GitHub UI

jobs:
  scrub-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Lead Pipeline
        env:
          WORKER_URL: "https://emergencyaudit.com"
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          ENABLE_TRACERFY: "true"
          PAUSE_PIPELINE: ${{ secrets.PAUSE_PIPELINE }}  # Set to "true" in GitHub Secrets to PAUSE execution
          NETWORK_1800_NUMBER: "18005550199"
        run: |
          python backend/scraper.py
