name: SoCal B2B Lead Scrubbing & Dispatch Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual trigger button in GitHub UI

jobs:
  scrub-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Lead Pipeline
        env:
          WORKER_URL: "https://emergencyaudit.com"
          MASTER_ADMIN_KEY: "SecretKey_2026_Dispatch!"
          TRACERFY_API_KEY: ${{ secrets.TRACERFY_API_KEY }}
          ENABLE_TRACERFY: "true"  # LIVE PAID SKIP-TRACING ACTIVATED
        run: |
          python so_cal_lead_pipeline.py
