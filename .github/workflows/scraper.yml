name: SoCal Courthouse Writ Scraper

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automated feed sweep every 6 hours
  workflow_dispatch: # Enables manual execution button in Actions tab

jobs:
  scrape-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Execute Court Scraper Pipeline
        env:
          EMERGENCY_KEY: ${{ secrets.EMERGENCY_KEY }}
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          API_URL: "https://emergencyaudit.com/api/ping"
        run: python scraper.py
