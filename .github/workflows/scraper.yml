name: 24/7 Live Lead Scraper Engine

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Live Lead Pipeline
        env:
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
        run: node public_scraper.js
