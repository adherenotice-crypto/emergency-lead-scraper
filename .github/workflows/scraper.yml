name: SoCal Courthouse Writ Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Chromium Binaries
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright playwright-stealth
          playwright install --with-deps chromium

      - name: Execute Stealth Scraper Pipeline
        env:
          EMERGENCY_KEY: ${{ secrets.EMERGENCY_KEY }}
          MASTER_ADMIN_KEY: ${{ secrets.MASTER_ADMIN_KEY }}
          API_URL: "https://emergencyaudit.com/api/ping"
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }} # Optional: Pass residential proxy if available
        run: python scraper.py
