name: SoCal Courthouse Writ Scraper

on:
  schedule:
    # 13:00 UTC = 6:00 AM PDT | 01:00 UTC = 6:00 PM PDT
    - cron: '0 1,13 * * *'
  workflow_dispatch: # Allows 1-click manual runs anytime

jobs:
  scrape-and-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Execute Court Scraper Pipeline
        env:
          WORKER_ENDPOINT: "https://emergencyaudit.com/api/ping"
          EMERGENCY_KEY: ${{ secrets.EMERGENCY_KEY }}
        run: python scraper.py
